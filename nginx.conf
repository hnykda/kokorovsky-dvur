server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- First-party Plausible proxy ------------------------------------------
    #
    # Blocklists (EasyPrivacy and its derivatives) match the *filename*
    # "plausible", not the domain serving it, so loading the script straight
    # from plan.danielhnyk.cz means blocker-running visitors never issue the
    # request at all and go uncounted. Serving it from this site's own origin
    # under a neutral path avoids every such rule.
    #
    # next-plausible's withPlausibleProxy() cannot do this here: it works via
    # Next.js rewrites, and this site is `output: "export"` — static files with
    # no Next server. Hence nginx.
    #
    # proxy_pass goes through a variable so the upstream name is resolved per
    # request. With a literal hostname nginx resolves once at startup and
    # refuses to boot when that fails, which would let a missing analytics
    # service take the site down. `resolver local=on` is not supported by
    # nginx:alpine, hence the kube-dns ClusterIP.
    resolver 10.152.183.10 valid=30s ipv6=off;

    location = /_v/s.js {
        set $plausible plausible-plausible-analytics.apps.svc.cluster.local;
        # Filename encodes the enabled extensions: trackOutboundLinks only.
        # Change the PlausibleProvider props and this must change to match.
        proxy_pass http://$plausible/js/plausible.outbound-links.js;
        proxy_set_header Host $plausible;
    }

    location = /_v/e {
        set $plausible plausible-plausible-analytics.apps.svc.cluster.local;
        proxy_pass http://$plausible/api/event;
        proxy_set_header Host $plausible;
        # Plausible hashes the visitor IP to count uniques and reads the
        # leftmost X-Forwarded-For entry, which the ingress already set to the
        # real client address.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/index.html /index.html;
    }
}
